<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅圖書籤匣 🏷️ - 我的旅行地圖</title>
    <style>
:root{
  /* ---- 基底表面（和紙 / 米白，低飽和暖白，非純白純灰）---- */
  --bg:#F7F2E7;                 /* 和紙米白 */
  --bg-tint-a:#FBF8F0;          /* 頂部暖光 */
  --bg-tint-b:#F0E9DD;          /* 底部暖影 */
  --surface:#FDFBF5;            /* 卡片/紙白 */
  --surface-subtle:#EFEADF;     /* 次要表面 */
  --surface-soft:#F4EEE2;       /* 柔軟表面 */

  /* ---- 主色：抹茶綠（自然 / 旅行 / 品牌識別）---- */
  --primary:#677441;            /* 按鈕/連結/焦點（AA: 白字4.80, 淺底4.89）*/
  --primary-deep:#545F30;       /* 深抹茶（標籤文字 5.66）*/
  --primary-soft:#E7EBDB;       /* 抹茶 tint */

  /* ---- 輔色：靛藍（資訊 / 次級 / 邊線重點）---- */
  --secondary:#3C5364;          /* 資訊文字（淺底 7.77）*/
  --secondary-deep:#2E414F;     /* 深靛（標籤 8.55）*/
  --secondary-soft:#E2E8EA;

  /* ---- 強調：柿色（星星 / 亮點 / 純圖形點綴，克制使用）---- */
  --accent:#C2693E;             /* 圖形/星星（淺底 3.77，用於大元素）*/
  --accent-deep:#A4502C;        /* 文字用柿（淺底 5.39）*/
  --accent-soft:#F4E4D5;

  /* ---- 文字層級（暖調墨色，帶 tint，不用純黑純灰）---- */
  --text-strong:#2E2B25;        /* 標題（12.64 / 13.63）*/
  --text-base:#46423A;          /* 內文（8.95 / 9.66）*/
  --text-muted:#6E6759;         /* 次要（5.02 / 5.42）*/
  --text-faint:#787160;         /* 最淡 placeholder（4.69）*/
  --on-primary:#FBF9F2;         /* 反白文字（4.80）*/

  /* ---- 邊線 / 分隔（裝飾性=柔和髮絲線；互動欄位=3:1 明確線）---- */
  --border:#E2DBC8;             /* 裝飾髮絲線（容器）*/
  --border-strong:#948A72;      /* 互動欄位邊線（3.31 ≥3:1）*/
  --divider:#ECE6D8;            /* 內部分隔線 */

  /* ---- 語意色 ---- */
  --success:#57714B;            /* 成功（5.25）*/
  --success-soft:#E7EDE0;
  --danger:#A6452E;             /* 危險（5.78）*/
  --danger-soft:#F5E2DC;

  /* ---- 圓角（克制：8/12/16，少用大圓）---- */
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:16px;
  --radius-pill:999px;

  /* ---- 陰影（統一帶暖灰/墨 tint，低而柔和）---- */
  --shadow-s:0 1px 3px rgba(62,56,42,.05), 0 2px 12px rgba(62,56,42,.05);
  --shadow-m:0 6px 16px rgba(62,56,42,.07), 0 10px 30px rgba(62,56,42,.06);
  --shadow-l:0 18px 42px rgba(56,50,38,.15);
  --shadow-focus:0 0 0 4px rgba(103,116,65,.20);

  /* ---- 8px 間距網格 ---- */
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:64px;

  /* ---- 字體（標題=明朝/宋體襯線；內文=乾淨 Sans）---- */
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Helvetica Neue",sans-serif;

  /* ---- 字階（模數階層）---- */
  --fs-h1:clamp(2rem, 4.5vw, 2.4rem);
  --fs-h2:1.4rem;
  --fs-title:1.2rem;
  --fs-number:2rem;
  --fs-body:1.0625rem;      /* 17px 熟齡友善 */
  --fs-lead:.9375rem;       /* 15px 引導/次要 */
  --fs-small:.875rem;       /* 14px */
  --fs-tiny:.8rem;          /* 13px 標籤 */
  --fs-caps:.75rem;         /* 12px 大寫眉標 */

  /* ---- 動效（克制 cubic-bezier，尊重系統偏好）---- */
  --ease:cubic-bezier(.2,.6,.2,1);
  --dur:.2s;
}

/* ---------- Reset ---------- */
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

/* ---------- Body（和紙米白 + 極淡雙色暖光）---------- */
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font-body);
  font-size:var(--fs-body);
  line-height:1.75;
  color:var(--text-base);
  background:var(--bg);
  background-image:
    radial-gradient(140% 60% at 50% -10%, var(--bg-tint-a) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(180deg, var(--bg-tint-a) 0%, var(--bg-tint-b) 100%);
  background-attachment:fixed;
  min-height:100dvh;
  padding:var(--sp-3) var(--sp-2) 120px;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{ background:var(--primary-soft); color:var(--primary-deep); }

.container{ max-width:880px; margin:0 auto; }

/* ---------- 通用型態 ---------- */
h1,h2,h3{ font-family:var(--font-display); font-weight:700; color:var(--text-strong); letter-spacing:.02em; }
p{ line-height:1.75; }
a{ color:var(--primary); }
a:hover{ color:var(--primary-deep); }

/* ---------- Header（旅人手帳風格 刊頭）---------- */
header{
  position:relative;
  text-align:center;
  margin-bottom:var(--sp-4);
  padding:var(--sp-4) var(--sp-2) var(--sp-3);
}
/* 刊頭上方一條細緻柿色髮絲線（克制，非厚色帶） */
header::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:56px; height:2px; border-radius:2px; background:var(--accent);
}
header h1{
  font-size:var(--fs-h1);
  font-weight:700;
  letter-spacing:.08em;         /* 襯線標題，拉開傳達手帳感 */
  line-height:1.2;
  margin-bottom:var(--sp-1);
  color:var(--text-strong);
}
.subtitle{
  font-size:var(--fs-caps);
  letter-spacing:.42em;         /* 大寫眉標，冷靜編輯感 */
  text-transform:uppercase;
  color:var(--text-muted);
  font-weight:500;
}
.sync-status{ font-size:var(--fs-small); color:var(--text-muted); margin-top:var(--sp-2); }
.sync-status.synced{ color:var(--success); font-weight:600; }

/* 使用者資訊 */
.user-info{ display:none; align-items:center; gap:var(--sp-1); margin-top:var(--sp-2); justify-content:center; }
.user-info.show{ display:flex; }
.user-avatar{ width:34px; height:34px; border-radius:50%; background:var(--surface-subtle); object-fit:cover; box-shadow:var(--shadow-s); }
.logout-btn{
  font-size:var(--fs-small); padding:8px 16px; background:transparent;
  border:1px solid var(--border-strong); border-radius:var(--radius-pill);
  cursor:pointer; color:var(--text-muted);
  font-family:var(--font-body); transition:all var(--dur) var(--ease); min-height:44px;
}
.logout-btn:hover{ background:var(--surface-subtle); color:var(--text-base); }

/* ---------- 搜尋列 ---------- */
.search-box{ position:relative; margin-bottom:var(--sp-3); }
.search-input{
  width:100%; padding:var(--sp-2) var(--sp-2) var(--sp-2) 48px;
  border:1px solid var(--border-strong);        /* 互動欄位 3:1 */
  border-radius:var(--radius-m);
  background:var(--surface);
  font-size:var(--fs-body); font-family:var(--font-body); color:var(--text-base);
  box-shadow:var(--shadow-s); outline:none;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search-input::placeholder{ color:var(--text-faint); }
.search-box::before{
  content:"🔍"; position:absolute; left:18px; top:50%; transform:translateY(-50%);
  font-size:1rem; opacity:.55; pointer-events:none;
}
.search-input:focus{ border-color:var(--primary); box-shadow:var(--shadow-focus); }

/* ---------- 分類（橫向膠囊列）---------- */
.categories{
  display:flex; gap:var(--sp-1); margin-bottom:var(--sp-3);
  flex-wrap:nowrap; justify-content:flex-start;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding-bottom:var(--sp-1); scrollbar-width:none;
}
.categories::-webkit-scrollbar{ display:none; }
.cat-btn{
  flex:0 0 auto; padding:10px 18px;
  border:1px solid var(--border-strong);        /* 互動元件 ≥3:1 */
  border-radius:var(--radius-pill); background:var(--surface);
  color:var(--text-base); font-size:var(--fs-small); font-family:var(--font-body);
  cursor:pointer; font-weight:500; min-height:44px;   /* ≥44px 觸控 */
  box-shadow:var(--shadow-s);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
             background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  white-space:nowrap;
}
.cat-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-m); border-color:var(--primary); color:var(--primary-deep); }
.cat-btn.active{
  background:var(--primary); color:var(--on-primary);
  border-color:var(--primary); box-shadow:var(--shadow-m);
}

/* ---------- 統計（極簡：襯線大數字，無盒）---------- */
.stats{
  display:flex; justify-content:center; align-items:baseline; gap:var(--sp-1);
  padding:var(--sp-2) 0; margin-bottom:var(--sp-2);
}
.stat-item{ text-align:center; }
.stat-number{ font-family:var(--font-display); font-size:var(--fs-number); color:var(--text-strong); font-weight:700; line-height:1.1; }
.stat-label{ font-size:var(--fs-caps); color:var(--text-muted); margin-top:4px; letter-spacing:.18em; }
/* 統計與備份之間一條細緻分隔線 */
.backup-actions{ position:relative; display:flex; justify-content:center; margin-bottom:var(--sp-3); }
.backup-actions::before{
  content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:100%; max-width:220px; height:1px; background:var(--divider);
}
.backup-btn{
  padding:11px 22px; border:1px solid var(--border-strong);
  border-radius:var(--radius-pill); background:var(--surface);
  color:var(--primary-deep); font-size:var(--fs-small); font-family:var(--font-body);
  font-weight:500; cursor:pointer; transition:all var(--dur) var(--ease); min-height:44px;
}
.backup-btn:hover{ background:var(--primary-soft); transform:translateY(-1px); box-shadow:var(--shadow-s); }

/* ---------- 載入 ---------- */
.loading{ text-align:center; padding:var(--sp-3); color:var(--text-muted); font-size:var(--fs-lead); }

/* ---------- 卡片網格 ---------- */
.cards-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:var(--sp-3); }

.card{
  position:relative; background:var(--surface);
  border-radius:var(--radius-m); overflow:hidden;
  box-shadow:var(--shadow-s);               /* 以陰影創造層次，不用厚邊框 */
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
/* 卡片頂部一條細緻主色染線（克制） */
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--primary-soft);
}
.card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-m); }
.card.has-location{ cursor:pointer; }
.card.has-location:hover{ box-shadow:var(--shadow-m); }

.card-image{
  width:100%; height:170px; object-fit:cover; display:block;
  background:linear-gradient(135deg,var(--surface-subtle),var(--surface-soft));
}
.card-body{ padding:var(--sp-2) var(--sp-2) var(--sp-1); }
.card-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-1); margin-bottom:var(--sp-2); }
.card-title{
  font-family:var(--font-display);
  font-size:var(--fs-title); font-weight:700; color:var(--text-strong);
  line-height:1.45; letter-spacing:.02em;
}
.card-category{
  font-size:var(--fs-tiny); padding:5px 12px; border-radius:var(--radius-pill);
  background:var(--primary-soft); color:var(--primary-deep); font-weight:600;
  flex-shrink:0;
}
.card-categories{ display:flex; gap:var(--sp-1); flex-wrap:wrap; margin-bottom:var(--sp-2); }
.card-tags{ display:flex; flex-wrap:wrap; gap:var(--sp-1); margin-bottom:var(--sp-2); }
.tag{
  font-size:var(--fs-tiny); padding:4px 11px; border-radius:var(--radius-pill);
  background:var(--surface-subtle); color:var(--text-muted); font-weight:500;
}
.card-note{ font-size:var(--fs-lead); color:var(--text-base); line-height:1.7; margin-bottom:var(--sp-2); }
.card-link{ display:inline-block; font-size:var(--fs-lead); color:var(--primary); text-decoration:none; font-weight:500; }
.card-link:hover{ text-decoration:underline; color:var(--primary-deep); }

.card-address{ font-size:var(--fs-lead); color:var(--text-base); margin-bottom:var(--sp-1); display:flex; align-items:flex-start; gap:7px; }
.card-address a{ color:var(--primary); text-decoration:none; font-weight:500; }
.card-address a:hover{ text-decoration:underline; }
.card-hours{ font-size:var(--fs-small); color:var(--secondary); margin-bottom:var(--sp-2); display:flex; align-items:flex-start; gap:7px; }

.card-actions{
  display:flex; gap:var(--sp-1); margin-top:var(--sp-2); padding-top:var(--sp-2);
  border-top:1px solid var(--divider);
}
.card-action-btn{
  padding:10px 18px; border:none; border-radius:var(--radius-s);
  font-size:var(--fs-small); font-weight:600; font-family:var(--font-body);
  cursor:pointer; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease);
  min-height:44px; flex:1;
}
.card-action-btn.edit{ background:var(--surface-subtle); color:var(--text-base); }
.card-action-btn.delete{ background:var(--danger-soft); color:var(--danger); }
.card-action-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-s); }
.card-action-btn:active{ transform:scale(.97); }

/* ---------- 空狀態 ---------- */
.empty-state{ text-align:center; padding:var(--sp-6) var(--sp-2); color:var(--text-muted); }
.empty-icon{ font-size:3rem; margin-bottom:var(--sp-2); opacity:.85; }
.empty-state p{ font-size:var(--fs-body); color:var(--text-muted); }

/* ---------- 浮動新增按鈕 ---------- */
.add-btn{
  position:fixed; bottom:30px; right:26px;
  width:60px; height:60px; border-radius:50%;
  background:var(--primary); color:var(--on-primary);
  border:none; font-size:1.9rem; line-height:1; cursor:pointer;
  box-shadow:var(--shadow-l);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
  z-index:100;
}
.add-btn:hover{ transform:translateY(-2px) rotate(90deg); box-shadow:0 18px 42px rgba(62,56,42,.24); background:var(--primary-deep); }
.add-btn:active{ transform:scale(.95); }

/* ---------- Modal ---------- */
.modal{
  display:none; position:fixed; inset:0;
  background:rgba(58,52,40,.34); backdrop-filter:blur(3px);
  z-index:200; justify-content:center; align-items:center; padding:var(--sp-2);
}
.modal.show{ display:flex; }
.modal-content{
  background:var(--surface); border-radius:var(--radius-l);
  padding:var(--sp-4) var(--sp-3); width:100%; max-width:470px; max-height:90vh;
  overflow-y:auto; box-shadow:var(--shadow-l);
}
.modal h2{
  font-size:var(--fs-h2); font-weight:700; letter-spacing:.04em;
  margin-bottom:var(--sp-3); color:var(--text-strong); text-align:center;
}
.form-group{ margin-bottom:var(--sp-2); }
.form-group label{ display:block; font-size:var(--fs-small); font-weight:600; color:var(--text-muted); margin-bottom:var(--sp-1); }
.form-group input,
.form-group textarea,
.form-group select{
  width:100%; padding:13px 15px;
  border:1px solid var(--border-strong);        /* 互動欄位 3:1 */
  border-radius:var(--radius-s); font-size:var(--fs-body); font-family:var(--font-body);
  color:var(--text-base); outline:none; transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  background:var(--surface);
}
.form-group input::placeholder,
.form-group textarea::placeholder{ color:var(--text-faint); }
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{ border-color:var(--primary); box-shadow:var(--shadow-focus); }
.form-group textarea{ min-height:92px; resize:vertical; }

/* Modal 內的分類多選膠囊 */
.category-buttons{ display:flex; flex-wrap:wrap; gap:var(--sp-1); }
.cat-select-btn{
  padding:10px 18px; border:2px solid var(--border);
  border-radius:var(--radius-pill); background:var(--surface);
  cursor:pointer; font-size:var(--fs-small); font-family:var(--font-body);
  color:var(--text-base); transition:all var(--dur) var(--ease); min-height:44px;
}
.cat-select-btn:hover{ border-color:var(--primary); color:var(--primary-deep); }
.cat-select-btn.selected{
  background:var(--primary); color:var(--on-primary);
  border-color:var(--primary); box-shadow:var(--shadow-s);
}

.modal-buttons{ display:flex; gap:var(--sp-2); margin-top:var(--sp-3); }
.modal-btn{
  flex:1; padding:14px; border:none; border-radius:var(--radius-pill);
  font-size:var(--fs-body); font-weight:600; font-family:var(--font-body);
  cursor:pointer; transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease); min-height:48px;
}
.modal-btn.cancel{ background:var(--surface-subtle); color:var(--text-base); }
.modal-btn.save{ background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow-s); }
.modal-btn:hover{ opacity:.92; transform:translateY(-1px); }
.modal-btn:active{ transform:scale(.97); }

/* 圖片預覽 */
#imagePreview img{ border-radius:var(--radius-s); box-shadow:var(--shadow-s); }

/* ---------- 登入頁 ---------- */
.login-screen{
  display:none; position:fixed; inset:0;
  background:var(--bg);
  background-image:
    radial-gradient(140% 70% at 50% 18%, var(--bg-tint-a) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(180deg,var(--bg-tint-a),var(--bg-tint-b));
  z-index:1000; justify-content:center; align-items:center; flex-direction:column;
  text-align:center; padding:var(--sp-4);
}
.login-screen.show{ display:flex; }
.login-screen h1{ font-size:clamp(2.2rem,7vw,2.9rem); font-weight:700; letter-spacing:.1em; color:var(--text-strong); }
.login-screen .subtitle{ margin-top:var(--sp-1); }
.login-screen p{ color:var(--text-muted); margin-top:var(--sp-3); font-size:var(--fs-body); }
.login-btn{
  padding:16px 46px; background:var(--primary); color:var(--on-primary);
  border:none; border-radius:var(--radius-pill); font-size:var(--fs-body);
  font-weight:600; font-family:var(--font-body); cursor:pointer; margin-top:var(--sp-3);
  box-shadow:var(--shadow-m); transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
}
.login-btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow-l); background:var(--primary-deep); }
.login-btn:active{ transform:scale(.97); }

/* ---------- 可近性：清楚的鍵盤 focus 標示（達 3:1）---------- */
:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px; border-radius:4px;
}
.modal-btn:focus-visible,
.cat-btn:focus-visible,
.add-btn:focus-visible,
.login-btn:focus-visible,
.backup-btn:focus-visible,
.logout-btn:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:3px;
  box-shadow:0 0 0 6px rgba(103,116,65,.18);
}
/* 供 focus ring 的圓形元件對齊 */
.add-btn:focus-visible,
.user-avatar:focus-visible{ border-radius:50%; }

/* ---------- 動效尊重：減少動態的系統偏好 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition:none!important; animation:none!important; }
  html{ scroll-behavior:auto; }
}

/* ---------- 平板 / 手機 ---------- */
@media (max-width:900px){
  .cards-grid{ grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
}
@media (max-width:640px){
  body{ padding:var(--sp-2) var(--sp-2) 110px; }
  header{ padding:var(--sp-3) var(--sp-1) var(--sp-2); }
  header h1{ letter-spacing:.06em; }
  .cards-grid{ grid-template-columns:1fr; gap:var(--sp-2); }
  .card-image{ height:150px; }
  .stats{ gap:8px; }
  .modal-content{ padding:var(--sp-3) var(--sp-2); max-width:100%; }
  .add-btn{ bottom:24px; right:18px; width:56px; height:56px; }
}

<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <h1>旅圖書籤匣</h1>
        <p class="subtitle">TRIPMARK DECK</p>

            <button class="cat-btn" data-cat="活動">🎪 活動</button>
            <button class="cat-btn" data-cat="登山">⛰️ 登山</button>
            <button class="cat-btn" data-cat="甜點">🍰 甜點</button>
            <button class="cat-btn" data-cat="攝影">📷 攝影</button>
            <button class="cat-btn" data-cat="秘境">🔮 秘境</button>
            <button class="cat-btn" data-cat="探店">🛍️ 探店</button>

            <div class="empty-icon">📍</div>

        </div>
    </div>

    <button class="add-btn" id="addBtn">+</button>

    <!-- Add/Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">新增收藏</h2>
            <form id="cardForm">
                <input type="hidden" id="cardId">
                <div class="form-group">
                    <label>標題 *</label>
                    <input type="text" id="cardTitle" placeholder="例：清境農場" required>
                </div>
                <div class="form-group">
                    <label>分類（可複選）</label>
                    <div class="category-buttons" id="categoryButtons">
                        <button type="button" class="cat-select-btn" data-value="景點">🌿 景點</button>
                        <button type="button" class="cat-select-btn" data-value="美食">🍜 美食</button>
                        <button type="button" class="cat-select-btn" data-value="住宿">🏠 住宿</button>
                        <button type="button" class="cat-select-btn" data-value="活動">🎪 活動</button>
                        <button type="button" class="cat-select-btn" data-value="登山">⛰️ 登山</button>
                        <button type="button" class="cat-select-btn" data-value="甜點">🍰 甜點</button>
                        <button type="button" class="cat-select-btn" data-value="攝影">📷 攝影</button>
                        <button type="button" class="cat-select-btn" data-value="秘境">🔮 秘境</button>
                        <button type="button" class="cat-select-btn" data-value="探店">🛍️ 探店</button>
                        <button type="button" class="cat-select-btn" data-value="咖啡">☕ 咖啡</button>
                    </div>
                    <input type="hidden" id="cardCategories" value="">
                </div>

                
                <div class="form-group">
                    <label>Tags（用逗號分隔）</label>
                    <input type="text" id="cardTags" placeholder="例：自然,拍照,療癒">
                </div>
                <div class="form-group">
                    <label>地址（點擊可開啟 Google Maps）</label>
                    <input type="text" id="cardAddress" placeholder="例：台北市信義區市府路1號">
                </div>
                <div class="form-group">
                    <label>營業時間</label>
                    <input type="text" id="cardHours" placeholder="例：週一至週六 17:00-20:00">
                </div>
                <div class="form-group">
                    <label>筆記 / 備註</label>
                    <textarea id="cardNote" placeholder="可以寫下你的心得、推薦原因..."></textarea>
                </div>
                <div class="form-group">
                    <label>連結（可選）</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="url" id="cardLink" placeholder="https://..." style="flex: 1;">
                        <button type="button" class="modal-btn save" id="fetchImageBtn" style="flex: 0; padding: 12px 15px;">🔍</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>圖片網址（可選）</label>
                    <input type="url" id="cardImage" placeholder="自動抓取或手動貼上">
                    <div id="imagePreview" style="margin-top: 8px; display: none;">
                        <img id="previewImg" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn cancel" id="cancelBtn">取消</button>
                    <button type="submit" class="modal-btn save">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHEVUsY-Q9A4SM8EBodKFbJvZaBNTIgEo",
            authDomain: "travel-collection-34302.firebaseapp.com",
            projectId: "travel-collection-34302",
            storageBucket: "travel-collection-34302.firebasestorage.app",
            messagingSenderId: "849403386441",
            appId: "1:849403386441:web:ae5db12b360dbf0778bd98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentUserUid = '';
        let cards = [];
        let selectedFilters = []; // Array for multi-select
        let searchQuery = '';

        const loginScreen = document.getElementById('loginScreen');
        const mainContent = document.getElementById('mainContent');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const syncStatus = document.getElementById('syncStatus');
        const modal = document.getElementById('modal');
        const cardForm = document.getElementById('cardForm');
        const cardsGrid = document.getElementById('cardsGrid');
        const emptyState = document.getElementById('emptyState');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('searchInput');
        const addBtn = document.getElementById('addBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const modalTitle = document.getElementById('modalTitle');

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        const ALLOWED_EDITORS = ['yabu.san@gmail.com', 'yang.bubu1978@gmail.com'];
        function isEditor() {
            return currentUser && ALLOWED_EDITORS.includes(currentUser.email);
        }

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('Login error:', error);
                alert('登入失敗，請再試一次');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            currentUserUid = user ? user.uid : '';
            if (user) {
                loginScreen.classList.remove('show');
                mainContent.style.display = 'block';
                userInfo.classList.add('show');
                userAvatar.src = user.photoURL || '';
                userName.textContent = user.displayName || user.email;
                initFirestore();
            } else {
                loginScreen.classList.add('show');
                mainContent.style.display = 'none';
                userInfo.classList.remove('show');
            }
        });

        function initFirestore() {
            onSnapshot(collection(db, "cards"), (snapshot) => {
                cards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCards();
                syncStatus.textContent = '✓ 已同步';
                syncStatus.classList.add('synced');
                loading.style.display = 'none';
            }, (error) => {
                console.error("Error:", error);
                syncStatus.textContent = '⚠️ 同步失敗';
            });
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.dataset.cat;
                
                if (cat === 'all') {
                    // "全部" clears all filters
                    selectedFilters = [];
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                } else {
                    // Toggle the category
                    document.querySelector('.cat-btn[data-cat="all"]').classList.remove('active');
                    if (selectedFilters.includes(cat)) {
                        selectedFilters = selectedFilters.filter(f => f !== cat);
                        btn.classList.remove('active');
                    } else {
                        selectedFilters.push(cat);
                        btn.classList.add('active');
                    }
                    
                    // If no filters selected, show "all" as active
                    if (selectedFilters.length === 0) {
                        document.querySelector('.cat-btn[data-cat="all"]').classList.add('active');
                    }
                }
                renderCards();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderCards();
        });

        // Download a local JSON backup; no data is uploaded anywhere.
        exportJsonBtn.addEventListener('click', () => {
            if (!isEditor()) {
                alert('請先使用擁有者帳號登入');
                return;
            }
            const backup = {
                format: 'travel-collection-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                cards: cards.map(({ id, ...card }) => ({ id, ...card }))
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const stamp = new Date().toISOString().slice(0, 10);
            link.href = url;
            link.download = `travel-collection-backup-${stamp}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            syncStatus.textContent = `✓ 已匯出 ${cards.length} 張卡片`;
        });

        // Category selection in form (multi-select)
        document.querySelectorAll('.cat-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Toggle selected state
                btn.classList.toggle('selected');
                // Update hidden input with selected categories
                const selected = Array.from(document.querySelectorAll('.cat-select-btn.selected')).map(b => b.dataset.value);
                document.getElementById('cardCategories').value = selected.join(',');
            });
        });

        addBtn.addEventListener('click', () => {
            cardForm.reset();
            document.getElementById('cardId').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            // Reset category buttons (none selected for new card)
            document.querySelectorAll('.cat-select-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('cardCategories').value = '';
            modalTitle.textContent = '新增收藏';
            modal.classList.add('show');
        });

        cancelBtn.addEventListener('click', () => modal.classList.remove('show'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

        document.getElementById('fetchImageBtn').addEventListener('click', async () => {
            const link = document.getElementById('cardLink').value;
            const title = document.getElementById('cardTitle').value;
            const btn = document.getElementById('fetchImageBtn');
            btn.textContent = '⏳';
            btn.disabled = true;

            try {
                let imageUrl = null;
                if (link) {
                    try {
                        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(link);
                        const response = await fetch(proxyUrl);
                        const data = await response.json();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(data.contents, 'text/html');
                        imageUrl = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('meta[name="twitter:image"]')?.content;
                    } catch (e) { console.log('Link fetch failed'); }
                }

                if (!imageUrl && title) {
                    try {
                        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&pithumbsize=500&format=json&origin=*`;
                        const response = await fetch(wikiUrl);
                        const data = await response.json();
                        const pages = data.query?.pages;
                        if (pages) {
                            for (const pageId in pages) {
                                if (pages[pageId].thumbnail) {
                                    imageUrl = pages[pageId].thumbnail.source;
                                    break;
                                }
                            }
                        }
                    } catch (e) { console.log('Wiki failed'); }
                }

                if (imageUrl) {
                    if (imageUrl.startsWith('//')) imageUrl = 'https:' + imageUrl;
                    document.getElementById('cardImage').value = imageUrl;
                    document.getElementById('previewImg').src = imageUrl;
                    document.getElementById('imagePreview').style.display = 'block';
                } else {
                    alert('找不到圖片，請手動貼上圖片網址');
                }
            } catch (error) {
                alert('抓取失敗');
            } finally {
                btn.textContent = '🔍';
                btn.disabled = false;
            }
        });

        document.getElementById('cardImage').addEventListener('input', (e) => {
            if (e.target.value) {
                document.getElementById('previewImg').src = e.target.value;
                document.getElementById('imagePreview').style.display = 'block';
            } else {
                document.getElementById('imagePreview').style.display = 'none';
            }
        });

        // Normalize text for duplicate detection (ignore spaces, punctuation and case)
        function normalizeForDuplicate(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[\s\u3000\-—_，。､、／/（）()「」『』【】\[\]!?！？：:；;]/g, '')
                .trim();
        }

        function findDuplicateCards(title, address, link, editingId = '') {
            const normalizedTitle = normalizeForDuplicate(title);
            const normalizedAddress = normalizeForDuplicate(address);
            const normalizedLink = normalizeForDuplicate(link);

            return cards.filter(card => {
                if (editingId && card.id === editingId) return false;
                const sameLink = normalizedLink && normalizeForDuplicate(card.link) === normalizedLink;
                const sameAddress = normalizedAddress && normalizeForDuplicate(card.address) === normalizedAddress;
                const sameTitle = normalizedTitle && normalizeForDuplicate(card.title) === normalizedTitle;
                // A source link or address is strong evidence; title alone catches exact-name duplicates.
                return sameLink || sameAddress || sameTitle;
            });
        }

        cardForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('cardId').value;
            const title = document.getElementById('cardTitle').value;
            const categoriesVal = document.getElementById('cardCategories').value;
            const categories = categoriesVal ? categoriesVal.split(',').filter(c => c) : [];
            const tags = document.getElementById('cardTags').value.split(',').map(t => t.trim()).filter(t => t);
            const address = document.getElementById('cardAddress').value.trim();
            const hours = document.getElementById('cardHours').value.trim();
            const note = document.getElementById('cardNote').value;
            const link = document.getElementById('cardLink').value;
            const image = document.getElementById('cardImage').value;

            if (categories.length === 0) {
                alert('請至少選擇一個分類');
                return;
            }

            // New cards: stop exact duplicates before writing to Firestore.
            // Editing an existing card is allowed; it excludes the current card from comparison.
            const duplicates = findDuplicateCards(title, address, link, id);
            if (!id && duplicates.length > 0) {
                const names = duplicates.slice(0, 3).map(card => `「${card.title || '未命名'}」`).join('、');
                const more = duplicates.length > 3 ? ` 等 ${duplicates.length} 張` : '';
                const proceed = confirm(`書籤匣已有相同或高度相似的卡片：\n${names}${more}\n\n仍要新增嗎？`);
                if (!proceed) return;
            }

            try {
                if (id) {
                    // Edit existing - keep original createdAt
                    const existingCard = cards.find(c => c.id === id);
                    await updateDoc(doc(db, "cards", id), { 
                        title, 
                        categories, 
                        tags, 
                        address,
                        hours,
                        note, 
                        link, 
                        image, 
                        ownerUid: existingCard?.ownerUid || currentUser.uid,
                        createdAt: existingCard?.createdAt || new Date().toISOString(),
                        updatedAt: new Date().toISOString() 
                    });
                } else {
                    // Add new
                    await addDoc(collection(db, "cards"), { 
                        title, 
                        categories, 
                        tags, 
                        address,
                        hours,
                        note, 
                        link, 
                        image, 
                        ownerUid: currentUser.uid,
                        createdAt: new Date().toISOString(), 
                        updatedAt: new Date().toISOString() 
                    });
                }
                modal.classList.remove('show');
            } catch (error) {
                console.error('Error:', error);
                alert('儲存失敗: ' + error.message);
            }
        });

        function renderCards() {
            let filteredCards = [...cards];
            
            // Sort by createdAt (newest first)
            filteredCards.sort((a, b) => {
                const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                return dateB - dateA;
            });
            
            // Filter by selected categories (show if card has ANY of the selected categories)
            if (selectedFilters.length > 0) {
                filteredCards = filteredCards.filter(c => {
                    const cardCats = c.categories || (c.category ? [c.category] : []);
                    return selectedFilters.some(f => cardCats.includes(f));
                });
            }
            if (searchQuery) filteredCards = filteredCards.filter(c => c.title.toLowerCase().includes(searchQuery) || (c.note && c.note.toLowerCase().includes(searchQuery)) || c.tags?.some(t => t.toLowerCase().includes(searchQuery)) || (c.address && c.address.toLowerCase().includes(searchQuery)));

            document.getElementById('totalCount').textContent = filteredCards.length;

            if (cards.length === 0) {
                cardsGrid.style.display = 'none';
                emptyState.style.display = 'none';
                return;
            }

            if (filteredCards.length === 0) {
                cardsGrid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            cardsGrid.style.display = 'grid';
            emptyState.style.display = 'none';

            cardsGrid.innerHTML = filteredCards.map(card => {
                // Support both old single category and new categories array
                const cardCats = card.categories || (card.category ? [card.category] : []);
                const catDisplay = cardCats.length > 0 ? cardCats.map(cat => `<span class="card-category">${escapeHtml(cat)}</span>`).join('') : '<span class="card-category">無分類</span>';
                
                return `
                <div class="card${card.address ? ' has-location' : ''}">
                    ${card.image ? `<img class="card-image" src="${escapeHtml(card.image)}" alt="${escapeHtml(card.title)}" onerror="this.style.display='none'">` : ''}
                    <div class="card-body">
                        <div class="card-header">
                            <div class="card-title">${escapeHtml(card.title)}</div>
                        </div>
                        <div class="card-categories" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${catDisplay}</div>
                        ${card.tags?.length ? `<div class="card-tags">${card.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
                        ${card.address ? `<div class="card-address">📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(card.address)}" target="_blank">${escapeHtml(card.address)}</a></div>` : ''}
                        ${card.hours ? `<div class="card-hours">🕐 ${escapeHtml(card.hours)}</div>` : ''}
                        ${card.note ? `<div class="card-note">${escapeHtml(card.note)}</div>` : ''}
                        ${card.link ? `<a href="${escapeHtml(card.link)}" target="_blank" class="card-link">🔗 查看來源</a>` : ''}
                        <div class="card-actions">
                            <button class="card-action-btn edit" data-id="${card.id}" ${isEditor() ? '' : 'style="display:none"'}>編輯</button>
                            ${isEditor() ? `<button class="card-action-btn delete" data-id="${card.id}">刪除</button>` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.editCard = function(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            document.getElementById('cardId').value = card.id;
            document.getElementById('cardTitle').value = card.title;
            
            // Support both old single category and new categories array
            const cardCats = card.categories || (card.category ? [card.category] : []);
            document.getElementById('cardCategories').value = cardCats.join(',');
            
            // Update category buttons
            document.querySelectorAll('.cat-select-btn').forEach(b => {
                b.classList.toggle('selected', cardCats.includes(b.dataset.value));
            });
            document.getElementById('cardTags').value = card.tags?.join(', ') || '';
            document.getElementById('cardAddress').value = card.address || '';
            document.getElementById('cardHours').value = card.hours || '';
            document.getElementById('cardNote').value = card.note || '';
            document.getElementById('cardLink').value = card.link || '';
            document.getElementById('cardImage').value = card.image || '';
            if (card.image) {
                document.getElementById('previewImg').src = card.image;
                document.getElementById('imagePreview').style.display = 'block';
            }
            modalTitle.textContent = '編輯收藏';
            modal.classList.add('show');
        };

        // Event delegation for card buttons
        cardsGrid.addEventListener('click', (e) => {
            const cardEl = e.target.closest('.card');
            if (cardEl && !e.target.closest('.card-action-btn')) {
                const linkEl = cardEl.querySelector('.card-address a');
                if (linkEl) { window.open(linkEl.href, '_blank'); return; }
            }
            if (e.target.classList.contains('edit')) {
                const id = e.target.dataset.id;
                window.editCard(id);
            }
            if (e.target.classList.contains('delete')) {
                const id = e.target.dataset.id || e.target.onclick?.toString().match(/'([^']+)'/)?.[1];
                if (id) window.deleteCard(id);
            }
        });

        window.deleteCard = async function(id) {
            if (confirm('確定要刪除嗎？')) {
                try {
                    await deleteDoc(doc(db, "cards", id));
                } catch (error) {
                    alert('刪除失敗');
                }
            }
        };
    </script>
</body>
</html>
